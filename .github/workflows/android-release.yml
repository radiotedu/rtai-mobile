name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android packages
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      # Public SHA-256 fingerprint of the permanent certificate used from v1.1.0.
      EXPECTED_ANDROID_CERT_SHA256: B3B08DB1C4AEFBF4251D53951061ADA727796479DE45D817F9576232FF2D9439

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify main release commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Production releases must run from main.' >&2; exit 1; }
          existing_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          [[ -z "$existing_commit" || "$existing_commit" == "$GITHUB_SHA" ]] || {
            echo "Release tag $RELEASE_TAG already points to another commit." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            study-game/package-lock.json
            mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify release tag matches every app target
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - name: Install Study dependencies
        working-directory: study-game
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x mobile/android/gradlew

      - name: Verify production WebViews and radio streams
        run: node scripts/verify-live-services.mjs --allow-unavailable-streams --allow-unavailable-voting

      - name: Validate release inputs and configure signing
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for value in \
            "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              printf '::add-mask::%s\n' "$value"
            fi
          done

          missing=()
          [[ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" ]] || missing+=(ANDROID_RELEASE_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            printf 'Release tag may contain only letters, digits, dots, underscores, and hyphens.\n' >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/radiotedu-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            printf 'Decoded release keystore is empty.\n' >&2
            exit 1
          fi

          actual_cert_sha256=$(
            keytool -exportcert \
              -keystore "$keystore_path" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" |
              sha256sum | awk '{ print toupper($1) }'
          )
          if [[ "$actual_cert_sha256" != "$EXPECTED_ANDROID_CERT_SHA256" ]]; then
            printf 'Android signing certificate does not match v1.0.0. Expected %s, got %s.\n' \
              "$EXPECTED_ANDROID_CERT_SHA256" "$actual_cert_sha256" >&2
            exit 1
          fi

          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > mobile/android/keystore.properties
          chmod 600 mobile/android/keystore.properties

      - name: Build signed phone, TV, and Wear packages
        working-directory: mobile/android
        run: >-
          ./gradlew
          :app:assembleRelease :app:bundleRelease
          :tv:assembleRelease :tv:bundleRelease
          :wear:assembleRelease :wear:bundleRelease
          --no-daemon

      - name: Remove release signing files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/radiotedu-release.jks"
          rm -f mobile/android/keystore.properties

      - name: Verify signatures and prepare release assets
        id: verify_packages
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            printf 'Android SDK location is not configured.\n' >&2
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            printf 'Android SDK apksigner was not found.\n' >&2
            exit 1
          fi

          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          declare -A labels=( [app]=Mobile [tv]=TV [wear]=Wear )

          for module in app tv wear; do
            apk="mobile/android/$module/build/outputs/apk/release/$module-release.apk"
            aab="mobile/android/$module/build/outputs/bundle/release/$module-release.aab"
            [[ -f "$apk" && -f "$aab" ]] || {
              printf 'Missing %s release package.\n' "$module" >&2
              exit 1
            }
            "$apksigner" verify --verbose --print-certs "$apk"
            jarsigner -verify -strict "$aab"
            cp "$apk" "$asset_dir/RadioTEDU-${labels[$module]}-${RELEASE_TAG}.apk"
            cp "$aab" "$asset_dir/RadioTEDU-${labels[$module]}-${RELEASE_TAG}.aab"
          done

          (cd "$asset_dir" && sha256sum -- * > SHA256SUMS.txt)
          printf 'asset_dir=%s\n' "$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Upload verified Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RadioTEDU-Android-${{ inputs.tag }}
          path: ${{ steps.verify_packages.outputs.asset_dir }}/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: RadioTEDU Mobile ${{ inputs.tag }}
          files: ${{ steps.verify_packages.outputs.asset_dir }}/*
          fail_on_unmatched_files: true
