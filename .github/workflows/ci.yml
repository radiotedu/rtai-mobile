name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            study-game/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: node --test tests/repository-contract.test.mjs

      - run: node scripts/verify-repository.mjs

      - working-directory: study-game
        run: npm ci

      - working-directory: study-game
        run: npm test

      - working-directory: study-game
        run: npm run build

      - working-directory: mobile
        run: npm ci

      - working-directory: mobile
        run: npm test -- --runInBand

      - working-directory: mobile
        run: npx tsc --noEmit

      - working-directory: mobile
        run: npx eslint . --quiet

      - working-directory: mobile
        run: npm run audit:android

      - run: chmod +x mobile/android/gradlew

      - working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - working-directory: mobile
        run: npm ci

      - working-directory: mobile
        run: bundle install

      - working-directory: mobile
        run: bundle exec pod install --project-directory=ios

      - working-directory: mobile
        run: >-
          xcodebuild
          -workspace ios/RadioTEDUMobile.xcworkspace
          -scheme RadioTEDUMobile
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
