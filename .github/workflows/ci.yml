name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            study-game/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: node --test tests/repository-contract.test.mjs tests/live-services.test.mjs tests/production-account.test.mjs tests/release-workflows.test.mjs

      - run: node scripts/verify-repository.mjs

      - working-directory: study-game
        run: npm ci

      - working-directory: study-game
        run: npm test

      - working-directory: study-game
        run: npm run build

      - working-directory: mobile
        run: npm ci

      - working-directory: mobile
        run: npm test -- --runInBand

      - working-directory: mobile
        run: npx tsc --noEmit

      - working-directory: mobile
        run: npx eslint . --quiet

      - working-directory: mobile
        run: npm run audit:android

      - run: chmod +x mobile/android/gradlew

      - name: Rebuild FLAC with 16 KB support
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          python3 scripts/build-flac-16k.py

      - name: Build phone and Android Auto; test TV and Wear
        working-directory: mobile/android
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:assembleDebug
          :tv:testDebugUnitTest
          :tv:assembleDebug
          :wear:testDebugUnitTest
          :wear:assembleDebug
          --no-daemon

  ios:
    # Firebase 11.15 uses Swift 6 language features (for example `sending`).
    # macos-15 provides an Xcode 16+ toolchain while keeping iOS 15 targets valid.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - working-directory: mobile
        run: npm ci

      - working-directory: mobile
        run: bundle install

      - working-directory: mobile
        run: bundle exec pod install --project-directory=ios

      - working-directory: mobile
        run: >-
          xcodebuild
          -workspace ios/RadioTEDUMobile.xcworkspace
          -scheme RadioTEDUMobile
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
