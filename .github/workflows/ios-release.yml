name: iOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ios-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    environment: production
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify main release commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo 'Production releases must run from main.' >&2; exit 1; }
          existing_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          [[ -z "$existing_commit" || "$existing_commit" == "$GITHUB_SHA" ]] || {
            echo "Release tag $RELEASE_TAG already points to another commit." >&2
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify release tag matches every app target
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - working-directory: mobile
        run: npm ci

      - working-directory: mobile
        run: bundle install

      - working-directory: mobile
        run: bundle exec pod install --project-directory=ios

      - name: Verify production WebViews and radio streams
        run: node scripts/verify-live-services.mjs --allow-unavailable-streams

      - name: Install signing identity and CarPlay profile
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for value in "$APPLE_TEAM_ID" "$IOS_BUNDLE_ID" "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" "$IOS_CERTIFICATE_PASSWORD" "$IOS_PROVISIONING_PROFILE_BASE64" "$IOS_KEYCHAIN_PASSWORD" "$APP_STORE_CONNECT_API_KEY_ID" "$APP_STORE_CONNECT_API_ISSUER_ID" "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64"; do
            [[ -n "$value" ]] || { echo 'Missing required iOS signing secret.' >&2; exit 1; }
            printf '::add-mask::%s\n' "$value"
          done
          [[ "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Za-z0-9_-]+$ ]] || { echo 'Invalid App Store Connect API key ID.' >&2; exit 1; }
          [[ "$APP_STORE_CONNECT_API_ISSUER_ID" =~ ^[A-Fa-f0-9-]+$ ]] || { echo 'Invalid App Store Connect API issuer ID.' >&2; exit 1; }

          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          keychain="$RUNNER_TEMP/radiotedu.keychain-db"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -Eq '[1-9][0-9]* valid identities found'

          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$RUNNER_TEMP/profile.plist")
          profile_app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          profile_carplay=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.carplay-audio' "$RUNNER_TEMP/profile.plist")
          [[ "$profile_team" == "$APPLE_TEAM_ID" ]] || { echo 'Provisioning profile team does not match APPLE_TEAM_ID.' >&2; exit 1; }
          [[ "$profile_app_id" == *."$IOS_BUNDLE_ID" ]] || { echo 'Provisioning profile does not match IOS_BUNDLE_ID.' >&2; exit 1; }
          [[ "$profile_carplay" == 'true' ]] || { echo 'Provisioning profile lacks the CarPlay audio entitlement.' >&2; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          printf 'PROFILE_NAME=%s\n' "$profile_name" >> "$GITHUB_ENV"
          printf 'PROFILE_UUID=%s\n' "$profile_uuid" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        working-directory: mobile
        run: >-
          xcodebuild archive
          -workspace ios/RadioTEDUMobile.xcworkspace
          -scheme RadioTEDUMobile
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/RadioTEDU.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>${IOS_BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RadioTEDU.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-release" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mapfile -d '' ipas < <(find "$RUNNER_TEMP/ios-release" -maxdepth 1 -type f -name '*.ipa' -print0)
          [[ ${#ipas[@]} -eq 1 ]] || { echo 'Expected exactly one exported IPA.' >&2; exit 1; }
          mv "${ipas[0]}" "$RUNNER_TEMP/RadioTEDU-iOS-${RELEASE_TAG}.ipa"

      - name: Validate and upload build to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          private_key_dir="$HOME/.appstoreconnect/private_keys"
          private_key="$private_key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$private_key_dir"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 --decode > "$private_key"
          chmod 600 "$private_key"
          [[ -s "$private_key" ]] || { echo 'Decoded App Store Connect private key is empty.' >&2; exit 1; }
          ipa="$RUNNER_TEMP/RadioTEDU-iOS-${RELEASE_TAG}.ipa"
          xcrun altool --validate-app -f "$ipa" -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: RadioTEDU-iOS-${{ inputs.tag }}
          path: ${{ runner.temp }}/RadioTEDU-iOS-${{ inputs.tag }}.ipa
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: RadioTEDU ${{ inputs.tag }}
          files: ${{ runner.temp }}/RadioTEDU-iOS-${{ inputs.tag }}.ipa
          fail_on_unmatched_files: true

      - name: Remove signing material
        if: always()
        shell: bash
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/radiotedu.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID:-missing}.mobileprovision"
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID:-missing}.p8"
