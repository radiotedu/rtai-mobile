name: Release Candidate Smoke
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android Release build run
        required: true
        type: string
      tag:
        description: Candidate tag
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_7, pixel_c]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: RadioTEDU-Android-${{ inputs.tag }}
          path: candidate
      - name: Verify candidate identity and checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq 'select(.name == "Android Release" and .conclusion == "success" and .head_branch == "main") | .head_sha')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          (cd candidate && sha256sum --check SHA256SUMS.txt)
          mkdir -p evidence
          version="${RELEASE_TAG#v}"
          code="$(node -e 'const v=process.argv[1].split(".").map(Number); console.log(v[0]*10000+v[1]*1000+v[2]*10)' "$version")"
          python3 scripts/verify-android-identity.py "candidate/RadioTEDU-Mobile-${RELEASE_TAG}.apk" --tools "$ANDROID_HOME/build-tools/35.0.0" --sha "$source_sha" --version "$version" --version-code "$code" > evidence/identity.json
      - name: Install animation-tolerant UI hierarchy reader
        run: python3 -m pip install uiautomator2==3.7.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            python3 scripts/verify-signed-candidate-device.py "candidate/RadioTEDU-Mobile-${RELEASE_TAG}.apk" evidence
            python3 scripts/verify-mobile-1311-features.py "candidate/RadioTEDU-Mobile-${RELEASE_TAG}.apk" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-${{ matrix.profile }}-${{ github.run_id }}
          path: evidence/
