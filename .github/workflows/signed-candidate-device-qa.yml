name: Signed Candidate Device QA

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device coverage to run
        type: choice
        default: both
        options:
          - both
          - phone
          - tablet
          - automotive
      media:
        description: Verify real radio audio, background controls and offline recovery
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  device:
    if: inputs.device != 'automotive'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.device == 'phone' && '[{"device":"phone","profile":"pixel_7"}]' || inputs.device == 'tablet' && '[{"device":"tablet","profile":"pixel_c"}]' || '[{"device":"phone","profile":"pixel_7"},{"device":"tablet","profile":"pixel_c"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34600299328
          name: RadioTEDU-Android-v1.3.9
          path: candidate
      - name: Verify exact existing candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo 'c46f4d298d7e1c139441010b65fb0199a867286924b73c4713916a917ae23874  candidate/RadioTEDU-Mobile-v1.3.9.apk' | sha256sum --check
          python3 scripts/verify-android-identity.py candidate/RadioTEDU-Mobile-v1.3.9.apk --tools "$ANDROID_HOME/build-tools/35.0.0" --sha 27ddb0cf440d590d7cf2c786e13ba42895b2f0c2 --version 1.3.9 --version-code 13090 > evidence/identity.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: python3 scripts/verify-signed-candidate-device.py candidate/RadioTEDU-Mobile-v1.3.9.apk evidence ${{ inputs.media && '--media' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-candidate-${{ matrix.device }}-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  automotive:
    if: inputs.device == 'automotive'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34600299328
          name: RadioTEDU-Android-v1.3.9
          path: candidate
      - name: Verify exact existing candidate
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo 'c46f4d298d7e1c139441010b65fb0199a867286924b73c4713916a917ae23874  candidate/RadioTEDU-Mobile-v1.3.9.apk' | sha256sum --check
          python3 scripts/verify-android-identity.py candidate/RadioTEDU-Mobile-v1.3.9.apk --tools "$ANDROID_HOME/build-tools/35.0.0" --sha 27ddb0cf440d590d7cf2c786e13ba42895b2f0c2 --version 1.3.9 --version-code 13090 > evidence/identity.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          system-image-api-level: 34-ext9
          target: android-automotive
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1280x720
          disable-animations: true
          script: python3 scripts/verify-signed-car-host.py candidate/RadioTEDU-Mobile-v1.3.9.apk evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-candidate-automotive-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
