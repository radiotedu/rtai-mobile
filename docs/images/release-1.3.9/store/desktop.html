<!doctype html>
<html lang="en"><meta charset="utf-8"><title>RadioTEDU desktop website preview</title>
<style>
@font-face{font-family:Manrope;src:url('../../release-1.3.7/fonts/Manrope.ttf')}
*{box-sizing:border-box}html,body{margin:0;width:2560px;height:1800px;overflow:hidden}
body{background:#f6f0e5;color:#151515;font-family:Manrope,Arial,sans-serif}
header{position:absolute;left:96px;right:96px;top:62px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:48px;font-weight:800;letter-spacing:-2px}.category{font-size:26px;letter-spacing:3px;font-weight:700}
h1{position:absolute;left:96px;top:164px;margin:0;font-size:120px;line-height:1.08;letter-spacing:-5px;font-weight:800}
h1 em{font-style:normal;color:#db142a}
.subtitle{position:absolute;right:110px;top:214px;width:580px;margin:0;font-size:38px;line-height:1.45;color:#57534c}
.disc{position:absolute;width:960px;height:960px;border-radius:50%;background:#e52335;left:-350px;top:750px}
.disc:after{content:'';position:absolute;inset:110px;border:3px solid #b81223;border-radius:50%;box-shadow:0 0 0 80px #e52335,0 0 0 83px #b81223}
.screen{position:absolute;left:455px;top:485px;width:1650px;padding:10px;background:#151515;border-radius:22px;box-shadow:0 28px 65px #18181825}
.bar{height:42px;color:#bcb9b3;display:flex;align-items:center;justify-content:center;font-size:18px;letter-spacing:1px}
.screen img{display:block;width:1630px;height:auto;border-radius:3px 3px 12px 12px}
footer{position:absolute;bottom:40px;left:96px;right:96px;display:flex;justify-content:space-between;color:#57534c;font-size:25px;letter-spacing:1px}
</style>
<header><span class="brand">RadioTEDU</span><span class="category">IN YOUR BROWSER</span></header>
<h1>At your desk.<br><em>On your wavelength.</em></h1>
<p class="subtitle">The RadioTEDU website.<br>Radio, podcasts and campus life.</p>
<div class="disc"></div>
<div class="screen"><div class="bar">radiotedu.com</div><img src="raw/website-home-20260913.png" alt="Actual RadioTEDU desktop website showing its homepage and bottom radio player"></div>
<footer><span>YOUR CAMPUS. YOUR SOUNDTRACK.</span><span>radiotedu.com</span></footer>
<script>document.fonts.ready.then(()=>document.documentElement.dataset.manrope=String(document.fonts.check('800 120px Manrope')))</script>
</html>
