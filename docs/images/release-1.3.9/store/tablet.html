<!doctype html>
<html lang="en"><meta charset="utf-8"><title>RadioTEDU tablet store preview</title>
<style>
@font-face{font-family:Manrope;src:url('../../release-1.3.7/fonts/Manrope.ttf')}
*{box-sizing:border-box}html,body{margin:0;width:2560px;height:1800px;overflow:hidden}
body{background:#f6f0e5;color:#151515;font-family:Manrope,Arial,sans-serif}
header{position:absolute;left:96px;right:96px;top:62px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:48px;font-weight:800;letter-spacing:-2px}.category{font-size:26px;letter-spacing:3px;font-weight:700}
h1{position:absolute;left:96px;top:146px;margin:0;font-size:142px;line-height:1.02;letter-spacing:-6px;font-weight:800}
h1 em{font-style:normal;color:#db142a}
.subtitle{position:absolute;right:110px;top:214px;width:670px;margin:0;font-size:38px;line-height:1.45;color:#57534c}
.disc{position:absolute;width:980px;height:980px;border-radius:50%;background:#e52335;left:-350px;top:710px}
.disc:after{content:'';position:absolute;inset:110px;border:3px solid #b81223;border-radius:50%;box-shadow:0 0 0 80px #e52335,0 0 0 83px #b81223}
.screen{position:absolute;left:422px;top:487px;width:1716px;padding:8px;background:#151515;border-radius:38px;box-shadow:0 28px 65px #18181825}
.screen img{display:block;width:1700px;height:auto;border-radius:30px}
footer{position:absolute;bottom:40px;left:96px;right:96px;display:flex;justify-content:space-between;color:#57534c;font-size:25px;letter-spacing:1px}
</style>
<header><span class="brand">RadioTEDU</span><span class="category">ON YOUR TABLET</span></header>
<h1>More room.<br><em>Same sound.</em></h1>
<p class="subtitle">Live radio and campus conversations.<br>A little more space to explore.</p>
<div class="disc"></div>
<div class="screen"><img src="raw/tablet-home-e32e04c.png" alt="Actual RadioTEDU tablet app showing stations, podcasts and playback controls"></div>
<footer><span>YOUR CAMPUS. YOUR SOUNDTRACK.</span><span>radiotedu.com</span></footer>
<script>document.fonts.ready.then(()=>document.documentElement.dataset.manrope=String(document.fonts.check('800 142px Manrope')))</script>
</html>
