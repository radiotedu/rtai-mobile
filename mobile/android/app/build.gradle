apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// Load release signing credentials from a gitignored keystore.properties file
// (never commit real keystores or passwords). If absent, release falls back to
// the debug key so local dev still builds — but a production release MUST use a
// real keystore. See docs/SECURITY_REVIEW.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    // Required for RN 0.76: links native modules discovered via autolinking as project dependencies
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// Metro 0.81's transitive image-size parser can loop on malformed modern
// image containers. Metro only parses local bundle assets, so reject those
// formats before any bundle task can inspect them.
def mobileRoot = rootProject.projectDir.parentFile
def unsafeBundlerAssets = fileTree(mobileRoot) {
    include 'src/**/*.icns', 'src/**/*.jxl', 'src/**/*.heif', 'src/**/*.heic'
    include 'assets/**/*.icns', 'assets/**/*.jxl', 'assets/**/*.heif', 'assets/**/*.heic'
}
if (!unsafeBundlerAssets.isEmpty()) {
    throw new GradleException("Unsafe image container in Metro bundle inputs: ${unsafeBundlerAssets.files}")
}

def gitShaOutput = new ByteArrayOutputStream()
exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', 'HEAD'
    standardOutput = gitShaOutput
}
def buildGitSha = gitShaOutput.toString('UTF-8').trim().toLowerCase()
if (!(buildGitSha ==~ /[0-9a-f]{40}/)) {
    throw new GradleException('Unable to bind Android build to an immutable Git SHA.')
}
def gitStatusOutput = new ByteArrayOutputStream()
exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'status', '--porcelain', '--untracked-files=all'
    standardOutput = gitStatusOutput
}
def buildGitDirty = !gitStatusOutput.toString('UTF-8').trim().isEmpty()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.radiotedumobile"
    defaultConfig {
        applicationId "com.radiotedumobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13000
        versionName "1.3.0"
        manifestPlaceholders.buildGitSha = buildGitSha
        manifestPlaceholders.buildGitDirty = buildGitDirty.toString()
    }
    // Single APK distribution: the same package installs on phones/tablets and
    // exposes optional Android Auto / Automotive media surfaces through the
    // main manifest, like standard media apps.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Uses a real release keystore when keystore.properties is present;
            // otherwise falls back to debug (dev only — NOT for production).
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

configurations.configureEach {
    // RN Track Player pulls KotlinAudio transitively. Replace it with the
    // reproducible RadioTEDU patch below so libFLAC can be preferred over
    // Android's failing platform decoder for continuous Ogg/FLAC streams.
    exclude group: "com.github.doublesymmetry", module: "kotlinaudio"
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // RN 0.76 uses Kotlin 1.9; newer Analytics 23.x artifacts require Kotlin 2.2.
    implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("androidx.appcompat:appcompat:1.7.1")
    implementation("androidx.mediarouter:mediarouter:1.8.1")
    implementation("com.google.android.gms:play-services-cast-framework:22.3.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Keep every Media3 artifact on one stable release. MediaLibraryService is the
    // future-proof browser/session surface used by Android Auto, AAOS, Assistant,
    // Gemini, system media controls, and Wear controllers. Playback stays native
    // and headless, with no dependency on the React Native runtime.
    // 1.11.x publishes Kotlin 2.2 metadata. RN 0.76's third-party Gradle
    // modules still invoke Kotlin 1.9, so 1.10.1 is the newest safe line until
    // the React Native toolchain is upgraded as a coordinated release.
    def media3Version = "1.10.1"
    // MediaConstants supplies the official Android Auto browse-style and
    // podcast completion keys; playback/session APIs themselves are Media3.
    implementation("androidx.media:media:1.7.0")
    implementation("androidx.media3:media3-session:${media3Version}")
    implementation("androidx.media3:media3-exoplayer:${media3Version}")
    implementation("androidx.media3:media3-common:${media3Version}")
    // media3-datasource provides DefaultHttpDataSource, used to give the car
    // stream finite connect/read timeouts so a half-open stream surfaces as an
    // error instead of buffering forever. It is a transitive dep of
    // media3-exoplayer, but declared explicitly so the import always resolves.
    implementation("androidx.media3:media3-datasource:${media3Version}")

    // Mobile playback still uses RN Track Player's ExoPlayer 2.19 stack.
    // The patched KotlinAudio builder enables extension renderers and this
    // native libFLAC module supplies the decoder used in PREFER mode.
    implementation(files("../vendor/kotlinaudio-v2.1.0-radiotedu.aar"))
    implementation(files("../vendor/exoplayer-flac-2.19.0-radiotedu.aar"))
    implementation("com.google.android.exoplayer:exoplayer:2.19.0")
    implementation("com.google.android.exoplayer:extension-mediasession:2.19.0")
    implementation("io.coil-kt:coil:2.2.0")
    implementation("com.jakewharton.timber:timber:5.0.1")

    // Pure JVM policy tests only; not packaged into release builds.
    testImplementation("junit:junit:4.13.2")
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
