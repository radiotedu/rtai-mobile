import org.gradle.api.artifacts.repositories.MavenArtifactRepository

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "26.1.10909125"
        // Wear Tiles 1.6 and the current Cast stack publish Kotlin 2.1
        // metadata, so the app compiler must understand the same ABI.
        kotlinVersion = "2.1.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories.configureEach { repository ->
        if (repository instanceof MavenArtifactRepository &&
                repository.url.toString().contains("oss.sonatype.org/content/repositories/snapshots")) {
            repository.content { content ->
                content.includeGroup("com.facebook.react")
            }
        }
    }
}
